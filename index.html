<!DOCTYPE html>
<html lang="Pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Financeira</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <body>
    <div class="container">
   <h1>Minha Calculadora de Orçamentos </h1>

   <div class="dashboard">
    <div class="card">
        <h3>Salário Base</h3>
        <p id="txt-salario">R$ 0,00</p>
    </div>
    <div class="card">
        <h3>Total Movimentado</h3>
        <p id="txt-movimentacoes">R$ 0,00</p>
    </div>
    <div class="card saldo-final">
        <h3>Saldo Atual</h3>
        <p id="txt-saldo">R$ 0,00</p>
    </div>
</div>

   <div class="section">
    <label for="salario base">Definir Salario Base (R$):</label>
    <input type="number" id="salario" placeholder="Ex:3000" step="0.01">
    <button onclick="definirSalario()">Definir</button>
   </div>

   <div class="section">
    <h2>Adicionar Movimentação</h2>
    <div class="form-group">
        <input type="text" id="descricao" placeholder="Descrição (Ex: Agua, Luz, Bônus)">
        <input type="number" id="valor" placeholder="Valor (R$)" step="0.01">
        <select id="tipo">
            <option value="ganho">Ganhos (+)</option>
            <option value="gasto">Gastos (-)</option>
        </select>
        <button onclick="adicionarMovimentacao()">Adicionar</button>
   </div>

   <div class="section">
    <h2>Histórico</h2>
    <ul id="lista-historico"></ul>
   </div>

   <button onclick="limparDados()" style="background-color: #7f8c8d;">Zerar Calculadora</button>

   <script src="script.js"></script>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
